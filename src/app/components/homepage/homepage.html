<!-- Sfondo video locale con file MP4 (senza 'muted' fisso) -->
<div class="video-background">
    <div class="video-overlay"></div>
    <video #bgVideo autoplay loop playsinline class="bg-video">
        <source src="Outro.mp4" type="video/mp4">
        Il tuo browser non supporta i video HTML5.
    </video>
</div>

<!-- Pulsante Audio in alto a destra (o fluttuante) -->
<div class="audio-control-container">
    <p-button 
        [icon]="isMuted ? 'pi pi-volume-off' : 'pi pi-volume-up'" 
        [label]="isMuted ? 'Attiva Audio' : 'Disattiva Audio'" 
        (onClick)="toggleAudio(bgVideo)" 
        [outlined]="true" 
        styleClass="p-button-secondary audio-btn">
    </p-button>
</div>
