<div class="cooldowns-container">
  <!-- Barra superiore con badge informativo e campo di ricerca -->
  <div class="table-header-toolbar">
    <div class="table-info">
      <span class="info-badge">PATCH 1.70</span>
      <span class="info-text">All values are listed in seconds (s)</span>
    </div>

    <div class="search-box">
      <input 
        type="text" 
        pInputText 
        [(ngModel)]="searchValue" 
        (input)="dt.filterGlobal($any($event.target).value, 'contains')" 
        placeholder="Search character..."
      />
    </div>
  </div>

  <!-- Tabella PrimeNG -->
  <p-table
    #dt
    [value]="cooldownsData"
    [paginator]="true"
    [rows]="15"
    [rowsPerPageOptions]="[10, 15, 25, 50, 100]"
    [globalFilterFields]="['character']"
    styleClass="p-datatable-ninja"
    [responsiveLayout]="'scroll'"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="character" class="col-character">
          CHARACTER <p-sortIcon field="character"></p-sortIcon>
        </th>
        <th pSortableColumn="baseJ1">
          BASE J1 (s) <p-sortIcon field="baseJ1"></p-sortIcon>
        </th>
        <th pSortableColumn="baseJ2">
          BASE J2 (s) <p-sortIcon field="baseJ2"></p-sortIcon>
        </th>
        <th pSortableColumn="awakeningJ1">
          AWK J1 (s) <p-sortIcon field="awakeningJ1"></p-sortIcon>
        </th>
        <th pSortableColumn="awakeningJ2">
          AWK J2 (s) <p-sortIcon field="awakeningJ2"></p-sortIcon>
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr>
        <td class="col-character">
          <strong>{{ item.character }}</strong>
        </td>
        <td>
          <span class="cooldown-pill" [class.fast]="item.baseJ1 <= 8" [class.slow]="item.baseJ1 >= 20">
            {{ item.baseJ1 }}s
          </span>
        </td>
        <td>
          <span class="cooldown-pill" [class.fast]="item.baseJ2 <= 8" [class.slow]="item.baseJ2 >= 20">
            {{ item.baseJ2 }}s
          </span>
        </td>
        <td>
          <span class="cooldown-pill awk" [class.fast]="item.awakeningJ1 <= 8" [class.slow]="item.awakeningJ1 >= 20">
            {{ item.awakeningJ1 }}s
          </span>
        </td>
        <td>
          <span class="cooldown-pill awk" [class.fast]="item.awakeningJ2 <= 8" [class.slow]="item.awakeningJ2 >= 20">
            {{ item.awakeningJ2 }}s
          </span>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty-msg">
          No matching ninja found.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
